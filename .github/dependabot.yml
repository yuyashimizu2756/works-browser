version: 2

# 依存更新はまとめて月1回。/ 無料枠の Actions 分数を無駄に消費しないため
# グループ化 + PR 数の上限を小さくする。
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      npm-minor:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: cargo
    directory: '/src-tauri'
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      cargo-minor:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ['*']
