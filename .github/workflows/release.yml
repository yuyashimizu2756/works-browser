name: Release

# タグ push のときだけ動かす（無料枠の消費を最小化）
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'リリースするタグ (例: v0.1.0)'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  # ffmpeg sidecar は git 管理外なので、ビルド前にここから取得する。
  # URL はバージョン固定のものだけを使う（ffmpeg-release-essentials.zip のような
  # 「常に最新」を指す可変 URL は、配布元の差し替えを検知できないので不可）。
  #
  # 更新時は URL・SHA-256・サイズの 3 点を同時に更新する（docs/release.md 参照）。
  # SHA-256 の出所: 配布元の公開 checksum
  #   https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-9.1-essentials_build.zip.sha256
  # サイズの出所: 同じ URL の Content-Length（119467219 B）。
  FFMPEG_URL: https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-9.1-essentials_build.zip
  FFMPEG_SHA256: b9bbbb3acece000cbeec994f856649354e52c773807841e78908374b24d658fd
  FFMPEG_SIZE: '119467219'
  FFMPEG_SIDECAR: src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe

# タグ名は `inputs.tag || github.ref_name` で決める（workflow_dispatch では inputs.tag、
# タグ push では github.ref_name）。workflow 直下の env に inputs コンテキストは置かない。

jobs:
  build:
    name: build-windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install frontend deps
        run: npm ci --no-audit --no-fund
        shell: bash

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: release-${{ runner.os }}

      # bundle.externalBin はビルド時にファイルの存在を要求するため、ここで用意する
      - name: Prepare ffmpeg sidecar
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          Invoke-WebRequest -Uri $env:FFMPEG_URL -OutFile $zip -UseBasicParsing

          # #110: 取得した zip が期待どおりかを検証する。不一致は警告で続行せず、
          # throw してビルドごと失敗させる（差し替えられたバイナリを同梱しない）。
          $expected = $env:FFMPEG_SHA256.Trim().ToLowerInvariant()
          if ($expected -notmatch '^[0-9a-f]{64}$') {
            throw "FFMPEG_SHA256 is not a 64-character hex digest: '$env:FFMPEG_SHA256'"
          }
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "ffmpeg SHA-256 mismatch: expected=$expected actual=$actual url=$env:FFMPEG_URL"
          }
          $expectedSize = [long]$env:FFMPEG_SIZE
          $actualSize = (Get-Item -LiteralPath $zip).Length
          if ($actualSize -ne $expectedSize) {
            throw "ffmpeg size mismatch: expected=$expectedSize actual=$actualSize url=$env:FFMPEG_URL"
          }
          "ffmpeg zip verified: sha256=$actual size=$actualSize B"

          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem $dir -Recurse -Filter 'ffmpeg.exe' | Select-Object -First 1
          if (-not $exe) { throw 'ffmpeg.exe not found in archive' }
          New-Item -ItemType Directory -Force -Path (Split-Path $env:FFMPEG_SIDECAR) | Out-Null
          Copy-Item $exe.FullName $env:FFMPEG_SIDECAR -Force
          & $env:FFMPEG_SIDECAR -version | Select-Object -First 1
          "sidecar: {0:N1} MB" -f ((Get-Item $env:FFMPEG_SIDECAR).Length / 1MB)

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'works-browser ${{ inputs.tag || github.ref_name }}'
          releaseBody: '変更点は自動生成のリリースノートを参照。'
          releaseDraft: true
          prerelease: false
          args: ''

      # #86: 配布物のサイズをログに残すだけ。サイズ超過でリリースを止めない
      # （失敗しても後続のアップロードを妨げないよう continue-on-error）。
      - name: Log bundle sizes
        shell: pwsh
        continue-on-error: true
        run: |
          Get-ChildItem -Path @(
            'src-tauri/target/release/works-browser.exe',
            'src-tauri/target/release/bundle/nsis/*.exe',
            'src-tauri/target/release/bundle/msi/*.msi'
          ) -ErrorAction SilentlyContinue |
            ForEach-Object { "{0}: {1:N2} MiB ({2} B)" -f $_.Name, ($_.Length / 1MB), $_.Length }

      # portable 版（インストール不要）も配布物として添付する
      - name: Upload portable exe to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release upload ${{ inputs.tag || github.ref_name }} 'src-tauri/target/release/works-browser.exe' --clobber

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ inputs.tag || github.ref_name }}
          path: |
            src-tauri/target/release/works-browser.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 14
